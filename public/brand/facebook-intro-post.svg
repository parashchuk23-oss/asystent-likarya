<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Асистент лікаря — презентаційний допис</title>
  <desc id="desc">Фірмове зображення проєкту Асистент лікаря для першого допису у Facebook.</desc>
  <defs>
    <linearGradient id="background" x1="76" y1="20" x2="1010" y2="1060" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF4FB"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <radialGradient id="softLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 260) rotate(47) scale(640)">
      <stop stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="navyShape" x1="784" y1="778" x2="1050" y2="1032" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
