  <rect width="1080" height="1080" fill="url(#background)"/>
  <rect width="1080" height="1080" fill="url(#softLight)"/>

  <image href="youtube-watermark.png" x="365" y="112" width="350" height="350" preserveAspectRatio="xMidYMid meet"/>

