  <g text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="540" y="613" fill="#0F172A" font-size="84" font-weight="750" letter-spacing="-2.8">Асистент лікаря</text>
    <text x="540" y="685" fill="#475569" font-size="37" font-weight="550" letter-spacing="-0.6">Цифровий робочий простір лікаря</text>
  </g>

